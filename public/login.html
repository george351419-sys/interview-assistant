<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 · 面试助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172033;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,390px);padding:30px;border:1px solid #e4e8f0;border-radius:18px;background:white;box-shadow:0 16px 48px #182b4b12}h1{margin:0 0 8px;font-size:24px}.sub{margin:0 0 24px;color:#687386;font-size:14px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}input,button{width:100%;height:48px;border-radius:10px;font:inherit}input{padding:0 14px;border:1px solid #cbd3df;outline:none}input:focus{border-color:#4568f5;box-shadow:0 0 0 3px #4568f522}button{margin-top:14px;border:0;background:#315cf5;color:white;font-weight:650;cursor:pointer}#error{min-height:20px;margin:12px 0 0;color:#c83232;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>面试助手</h1>
    <p class="sub">这是私人练习空间，请输入访问密码。</p>
    <form id="form">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">进入练习</button>
      <p id="error" role="status"></p>
    </form>
  </main>
  <script>
    const form=document.getElementById('form'), error=document.getElementById('error');
    form.addEventListener('submit',async e=>{
      e.preventDefault(); error.textContent='';
      try{
        const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value,next:new URLSearchParams(location.search).get('next')||'/'})});
        const d=await r.json(); if(!r.ok) throw new Error(d.error||'登录失败'); location.replace(d.next||'/');
      }catch(err){error.textContent=err.message||'连接失败，请重试';}
    });
  </script>
</body>
</html>
